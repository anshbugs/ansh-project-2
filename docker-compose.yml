services:
  streamlit:
    build: .
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      # Set these in your shell, or add them to a local `.env` file (do not commit secrets).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL:-openrouter/auto}
    restart: unless-stopped

